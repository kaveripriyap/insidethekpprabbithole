# The Curators page.
about:
  - "We are two sisters, usually found in two of four cities at once: Berlin, Singapore, Frankfurt and Hyderabad."
  - "We make whatever we feel like making: things you wear, things that hold other things, things that light up, things that move, and a few things nobody asked for. If it needs a printer, a needle, a soldering iron or all three in one afternoon, so much the better."
  - "This is where all of it lives. The newest things are near the surface. The oldest are at the very bottom."

# Things said to you on the way down. One appears between each year.
asides:
  - "Mind the years. They are larger down here."
  - "How deep does it go? About as far back as we've been making things."
  - "You are now roughly the size of an earring. Carry on."
  - "What holds everything and is made of nothing? (You're in it.)"
  - "Nearly there. Or nearly somewhere."
  - "If you see a dinosaur, it's a whale. Long story."

