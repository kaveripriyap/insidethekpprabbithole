# ─────────────────────────────────────────────────────────────────────────────
#  THE ONE SET OF DESIGN TOKENS
#  Everything visual on the site, the /brand page, the logo files and the
#  Etsy images is built from the values in this file. Change a value here,
#  rebuild, and it changes everywhere.
# ─────────────────────────────────────────────────────────────────────────────

colour:
  page:   { value: "#EFE7D8", role: "The surface. Old storybook paper: page background, text in the deep." }
  ink:    { value: "#17120F", role: "Printed words on paper." }
  burrow: { value: "#0C1A18", role: "The deep. The inside of the hole, a green so dark it is almost night." }
  velvet: { value: "#14302B", role: "Drawer lining. Raised surfaces in the deep." }
  gilt:   { value: "#C8A24B", role: "Gold leaf. Numerals, rules and labels in the deep." }
  brass:  { value: "#7A5C14", role: "Gilt's readable sibling, for small words on paper." }
  ember:  { value: "#FF5533", role: "Kinnera's ear, the straight one. Lit on everything Kinnera made." }
  lagoon: { value: "#19CDBD", role: "Kaveri's ear, the curious one. Lit on everything Kaveri made." }
  bone:   { value: "#F8F3E9", role: "Label card. Placards, fields, drawer fronts." }
  dust:   { value: "#D4C9B4", role: "Hairlines on paper." }
  ash:    { value: "#5F564A", role: "Quiet words on paper." }
  moss:   { value: "#2B4A43", role: "Hairlines in the deep." }
  fog:    { value: "#A9B3A6", role: "Quiet words in the deep." }

# Colours of the dream you fall through. Decoration only, never for words.
dream:
  dawn:   "#F3A99B"
  sea:    "#1F7A72"
  plum:   "#5A2B4D"
  candle: "#F4C56E"

# Who made it. `ear` is which ear of the mark lights up.
makers:
  kinnera: { name: "Kinnera", ear: left,  colour: ember,  glyph: "!" }
  kaveri:  { name: "Kaveri",  ear: right, colour: lagoon, glyph: "?" }

type:
  story: { family: "Fraunces",      fallback: "'Iowan Old Style', 'Palatino Linotype', Georgia, serif", use: "Everything that is read: titles (heavy, wonky), our one-liners (italic), stories (roman), big numerals (thin, soft italic)." }
  label: { family: "Fraunces",      fallback: "'Iowan Old Style', 'Palatino Linotype', Georgia, serif", use: "Small engraved capitals, widely spaced: accession numbers, navigation, buttons." }
  hand:  { family: "Reenie Beanie", fallback: "'Segoe Print', 'Bradley Hand', cursive", use: "Anything written by hand: notes in the margin, and the paper tags in the Cabinet." }

space:   # one scale, in rem
  1: 0.25
  2: 0.5
  3: 0.75
  4: 1
  5: 1.5
  6: 2
  7: 3
  8: 4.5
  9: 7

motion:
  quick: 140ms
  base: 320ms
  slow: 720ms
  ease-land: "cubic-bezier(.2,.9,.2,1)"     # lands softly
  ease-drop: "cubic-bezier(.6,0,.9,.4)"     # falls away

shape:
  hairline: 1px
  corner: 2px

# The photo grade. One look for every photo, applied by the build.
# (See docs/PHOTOS.md. Originals in photos/ are never touched.)
grade:
  paper_white: "#EFE7D8"   # white walls are balanced toward this, so photos melt into the page
  balance: 0.6             # 0 = leave white balance alone, 1 = fully neutralise then tint to paper
  exposure: 0.8            # 0 = leave brightness alone, 1 = fully even out
  contrast: 0.16           # strength of the gentle S-curve
  saturation: 1.0          # 1 = as shot (plus a whisper); raise or lower to taste
  sharpen: 0.55
