# ─────────────────────────────────────────────────────────────────────────────
#  SHELF: things
#  Every .md file in this folder is one thing we made. The file name becomes
#  the web address: content/things/world-mappy.md → /project/world-mappy/
# ─────────────────────────────────────────────────────────────────────────────

title: "Everything we came back holding"
nav: "All finds"          # label in the menu. Remove this line to hide from the menu.
url: project              # items live at /project/<file-name>/ (kept from the old site)
singular: find            # what one item is called ("Find No. 7")
look: finds               # finds = photo + specimen tag. Other looks: notes, shop
numbered: true            # give each item a find number, oldest = No. 001
order: oldest-first       # how the numbers are counted

# The chambers of the burrow. Each thing says which one it lives in with
#   family: holdas
# Add a chamber by adding a block here. Colours come from design/tokens.yaml.
families:
  - key: holdas
    name: Holdas
    colour: yolk
    blurb: "Things that hold other things. Kaveri named them, and the name stuck."
  - key: demon-equipment
    name: Demon Equipment
    colour: tomato
    blurb: "Horns, mines, bats and possibly-cursed cats. Standard issue for the demon in everyone."
  - key: critters
    name: Critters
    colour: bubblegum
    blurb: "Bees, whales, androids, and one tentacle that never ends."
  - key: wearables
    name: Wearables
    colour: lilac
    blurb: "Things you put on: ears, heads, whole outfits."
  - key: glowy-things
    name: Glowy Things
    colour: glow
    blurb: "They light up, glow in the dark, or make flipping a switch more fun."
  - key: surfaces
    name: Surfaces
    colour: sky
    blurb: "Places to put snacks, feet, and occasionally yourself."
  - key: contraptions
    name: Contraptions
    colour: mint
    blurb: "Gears, sensors, and a machine that shuffles the cards for you."
  - key: us
    name: Us
    colour: periwinkle
    blurb: "The makers, occasionally made into things."
