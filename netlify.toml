# ─────────────────────────────────────────────────────────────────────────────
#  Netlify settings. If you link this repository to a Netlify site, these are
#  picked up automatically: there is nothing to type into Netlify's forms.
#     Build command:      npm run build
#     Publish directory:  dist
#     Node version:       22
# ─────────────────────────────────────────────────────────────────────────────
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Remembers processed photos between builds, so adding one thing takes seconds.
[[plugins]]
  package = "./netlify/plugins/photo-cache"

# A deliberate, strict security policy. The site ships no inline scripts or
# styles, so nothing here needs loosening. frame-src is only for films that a
# thing chooses to embed from YouTube or Vimeo.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' https:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Files with a fingerprint in their name never change, so browsers may keep them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
